<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>샤먼 가족여행 11월</title>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* Layout: 한 손으로 넘겨 보는 7개 탭(1~4일, 지도, 맛집, 준비). 지도 탭은 실제 지도(Amap 타일) + 현재 위치 + 가까운 순 리스트, 맛집은 메뉴 사전에서 골라 중국어 주문서를 만드는 구조. */
:root{
  --bg:#F2F6F7; --surface:#FFFFFF; --ink:#13262B; --muted:#5B6F75; --line:#D5E0E3;
  --accent:#0B6E7B; --accent-ink:#FFFFFF; --soft:#E3F0F2; --warn:#B4402B; --warn-bg:#FBE9E5;
  --d1:#0B6E7B; --d2:#B5651D; --d3:#5B4BB7; --d4:#5B6F75;
  --f-display:'Do Hyeon','Noto Sans KR',sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --f-han:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E181B; --surface:#16252A; --ink:#E6EFF1; --muted:#93A8AE; --line:#27393F;
    --accent:#5CC0CD; --accent-ink:#0E181B; --soft:#1A2E34; --warn:#F08A74; --warn-bg:#3A1F19;
    --d1:#5CC0CD; --d2:#E0A25A; --d3:#A79BF0; --d4:#93A8AE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181B; --surface:#16252A; --ink:#E6EFF1; --muted:#93A8AE; --line:#27393F;
  --accent:#5CC0CD; --accent-ink:#0E181B; --soft:#1A2E34; --warn:#F08A74; --warn-bg:#3A1F19;
  --d1:#5CC0CD; --d2:#E0A25A; --d3:#A79BF0; --d4:#93A8AE;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;
  padding-block:0 96px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--bg)}
.wrap{max-width:640px; margin:0 auto}
a{color:var(--accent)}

header{padding-block:22px 14px}
.eyebrow{font-size:12px; letter-spacing:.08em; color:var(--muted); margin:0 0 4px}
h1{font-family:var(--f-display); font-weight:400; font-size:34px; line-height:1.15; margin:0 0 4px; text-wrap:balance}
.sub{color:var(--muted); margin:0}
.flights{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px}
.flight{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:0}
.flight b{font-family:var(--f-display); font-weight:400; font-size:17px; color:var(--accent)}
.flight div{font-size:13px}
.flight .t{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}
.tz{margin:10px 0 0; font-size:13px; color:var(--muted)}
.pnr{font-variant-numeric:tabular-nums; letter-spacing:.04em}

nav{
  position:sticky; top:env(safe-area-inset-top, 0px); z-index:5; background:var(--bg);
  display:grid; grid-template-columns:repeat(7,1fr); gap:3px; padding-block:8px;
  border-bottom:1px solid var(--line);
}
nav button{
  font:inherit; color:var(--muted); background:transparent; border:0; border-radius:8px; padding:6px 0 5px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; line-height:1.25; min-width:0;
}
nav button b{font-size:14px; font-weight:700}
nav button small{font-size:10px; font-variant-numeric:tabular-nums}
nav button[aria-selected="true"]{background:var(--accent); color:var(--accent-ink)}
button:focus-visible, a:focus-visible, label:focus-within{outline:2px solid var(--accent); outline-offset:2px}

section.view{padding-top:18px}
h2{font-family:var(--f-display); font-weight:400; font-size:26px; margin:0 0 2px; text-wrap:balance}
.lead{color:var(--muted); margin:0 0 16px}
h3{font-size:13px; letter-spacing:.06em; color:var(--muted); margin:26px 0 8px; font-weight:700}
.han{font-family:var(--f-han)}

.timeline{list-style:none; margin:0; padding:0}
.timeline li{display:grid; grid-template-columns:56px 1fr; gap:12px; padding-block:12px; border-top:1px solid var(--line)}
.timeline li:first-child{border-top:0}
.time{font-variant-numeric:tabular-nums; font-weight:700; color:var(--accent); font-size:14px; padding-top:1px}
.ev{min-width:0}
.ev strong{display:block; font-weight:700}
.ev span.note{display:block; color:var(--muted); font-size:14px}
.tag{display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px; margin-left:6px; vertical-align:1px}
.tag.opt{background:var(--soft); color:var(--accent)}
.tag.book{background:var(--warn-bg); color:var(--warn)}

.box{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
.box + .box{margin-top:10px}
.box.alert{border-color:var(--warn); background:var(--warn-bg)}
.box h4{margin:0 0 4px; font-size:14px}
.box p{margin:0; font-size:14px}
.box ul{margin:4px 0 0; padding-left:18px; font-size:14px}
.gap{margin-top:16px}

.book-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px}
.book-list li{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:start; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.book-list .when{font-size:12px; font-weight:700; color:var(--warn); background:var(--warn-bg); border-radius:999px; padding:2px 9px; white-space:nowrap}
.book-list b{display:block}
.book-list span.d{font-size:13px; color:var(--muted)}

/* 칩 (필터, 메뉴 선택) */
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{
  font:inherit; font-size:13px; color:var(--ink); background:var(--surface); border:1px solid var(--line);
  border-radius:999px; padding:5px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; min-width:0;
}
.chip[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.chip .dot{width:9px; height:9px; border-radius:50%; background:currentColor; flex:none}
.chip.dish{align-items:flex-start; flex-direction:column; gap:0; border-radius:12px; padding:6px 12px; text-align:left; text-decoration:none}
.chip.dish .cam{font-size:12px; vertical-align:2px}
.chip.dish .z{font-family:var(--f-han); font-size:17px; line-height:1.3}
.chip.dish .k{font-size:12px; opacity:.85}
.dwrap{display:flex; flex-direction:column; align-items:flex-start; gap:4px; min-width:0}

/* 지도 */
.mapbox{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px; margin-top:12px}
/* 지도 탭 */
.mtools{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-top:12px}
.seg{display:inline-flex; background:var(--soft); border-radius:10px; padding:3px; gap:2px}
.seg button{font:inherit; font-size:14px; font-weight:700; color:var(--accent); background:transparent; border:0; border-radius:8px; padding:6px 14px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.locbtn{font:inherit; font-size:13px; font-weight:700; color:var(--accent); background:var(--surface); border:1px solid var(--accent); border-radius:10px; padding:6px 12px; cursor:pointer}
.locbtn[data-on="1"]{background:var(--accent); color:var(--accent-ink)}
.chips.gapt{margin-top:10px}
#lmap{height:62vh; min-height:320px; border-radius:12px; border:1px solid var(--line); margin-top:12px; background:var(--soft); z-index:0}
.mstatus{font-size:12px; color:var(--muted); margin:8px 2px 0}
.mstatus.warn{color:var(--warn)}
/* 지도 색을 빼서 핀이 도드라지게 */
#lmap .leaflet-tile-pane{filter:grayscale(.6) brightness(1.05) contrast(.9)}
/* 핀: 흰 동그라미 + 색 테두리 + 그림 아이콘, 아래 꼬리. 회전 없이 가운데 정렬. 지도 위라 테마와 무관하게 고정색 */
.pin{--c:#D2412C; position:relative; width:32px; height:32px; border-radius:50%; background:#fff; border:3px solid var(--c); box-shadow:0 2px 6px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; font-size:17px; line-height:1}
.pin::after{content:""; position:absolute; left:50%; bottom:-9px; transform:translateX(-50%); border:6px solid transparent; border-top:7px solid var(--c); border-bottom:0}
.pin.p-rest{--c:#D2412C} .pin.p-place{--c:#0B7F8C} .pin.p-bar{--c:#B5651D} .pin.p-home{--c:#6A4FD0; width:40px; height:40px; font-size:21px}
.pin.approx{border-style:dashed}
.plabel.leaflet-tooltip{display:none; background:rgba(255,255,255,.92); color:#13262B; border:0; box-shadow:0 1px 3px rgba(0,0,0,.3); font:700 11px/1.3 var(--f-body); padding:1px 6px; border-radius:6px}
.plabel.leaflet-tooltip::before{display:none}
.show-labels .plabel.leaflet-tooltip{display:block}
.mlegend{background:rgba(255,255,255,.94); color:#13262B; border-radius:8px; padding:5px 8px; box-shadow:0 1px 4px rgba(0,0,0,.3); display:flex; gap:10px; font:700 12px/1 var(--f-body)}
.mlegend span{display:inline-flex; align-items:center; gap:4px}
.mlegend i{font-style:normal; width:20px; height:20px; border-radius:50%; background:#fff; border:2px solid; display:flex; align-items:center; justify-content:center; font-size:11px}
.me{width:16px; height:16px; border-radius:50%; background:#1A73E8; border:3px solid #fff; box-shadow:0 0 0 2px rgba(26,115,232,.35)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface); color:var(--ink)}
.leaflet-popup-content{margin:12px 14px; font-family:var(--f-body); font-size:14px; line-height:1.5; min-width:220px}
.leaflet-container a.lnk{color:var(--accent)}
.pc h4, .nlist h4{margin:0; font-size:16px; line-height:1.35}
.pc .top, .nlist .top{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.pc .zh, .nlist .zh{font-family:var(--f-han); color:var(--muted); font-size:14px}
.pc .meta, .nlist .meta{font-size:13px; color:var(--muted); margin:4px 0 0}
.pc .chips, .nlist .chips{margin-top:8px}
.pc .acts{justify-content:flex-start; margin-top:10px}
.dist{font-size:12px; font-weight:700; color:var(--accent); white-space:nowrap; font-variant-numeric:tabular-nums}
.approxnote{font-size:11px; color:var(--warn); font-weight:700}
.nlist{list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:10px}
.nlist li{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.nlist .top{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.kind{display:inline-block; font-size:11px; font-weight:700; border-radius:999px; padding:1px 7px; margin-right:4px; vertical-align:1px}
.kind.k-rest{background:var(--warn-bg); color:var(--warn)} .kind.k-bar{background:#F6E7D6; color:#8A4A12} .kind.k-place{background:var(--soft); color:var(--accent)}
.nlist .acts{justify-content:flex-start; margin-top:8px}
.basepick{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:13px; color:var(--muted); margin-top:10px}
.mapnote{font-size:12px; color:var(--muted); margin:8px 2px 0}

.plist{list-style:none; margin:0; padding:0}
.plist li{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; padding-block:10px; border-top:1px solid var(--line)}
.plist li:first-child{border-top:0}
.plist .ko{font-size:13px; color:var(--muted)}
.plist .zh{font-family:var(--f-han); font-size:18px; line-height:1.35; word-break:break-all}
.plist .zh.small{font-size:15px}
.acts{display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end}
.copy, .lnk{
  font:inherit; font-size:12px; font-weight:700; color:var(--accent); background:var(--soft);
  border:0; border-radius:8px; padding:6px 10px; cursor:pointer; white-space:nowrap; text-decoration:none; display:inline-block;
}

/* 맛집 */
.rest{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-top:10px}
.rest .top{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.rest h4{margin:0; font-size:16px}
.rest .price{font-size:13px; font-weight:700; color:var(--accent); white-space:nowrap}
.rest .zh{font-family:var(--f-han); font-size:15px; color:var(--muted)}
.rest .meta{font-size:13px; color:var(--muted); margin:4px 0 0}
.rest .sig{font-size:14px; margin:6px 0 0}
.rest .rn{font-size:13px; margin:6px 0 0}
.rest .acts{justify-content:flex-start; margin-top:10px}
.badge{display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:999px; background:var(--soft); color:var(--accent); margin-right:4px}
.badge.hot{background:var(--warn-bg); color:var(--warn)}

/* 음식 사진 창: 아래에서 올라오는 시트. 페이지를 떠나지 않음 */
#photo{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.55); display:flex; align-items:flex-end; justify-content:center}
#photo .card{background:var(--surface); color:var(--ink); width:100%; max-width:520px; border-radius:16px 16px 0 0; overflow:hidden;
  padding-bottom:calc(14px + env(safe-area-inset-bottom, 0px))}
#photo .img{width:100%; aspect-ratio:4/3; background:var(--soft); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px}
#photo img{width:100%; height:100%; object-fit:cover; display:block}
#photo .txt{padding:12px max(16px, env(safe-area-inset-left, 0px)) 0}
#photo .z{font-family:var(--f-han); font-size:26px; line-height:1.3}
#photo .k{font-size:15px; color:var(--muted)}
#photo .credit{font-size:11px; color:var(--muted); margin-top:8px}
#photo .credit a{color:var(--muted)}
#photo .close{position:absolute; right:max(12px, env(safe-area-inset-right, 0px)); top:calc(12px + env(safe-area-inset-top, 0px)); font:inherit; font-size:15px; font-weight:700; background:#fff; color:#13262B; border:0; border-radius:999px; padding:8px 14px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.3)}
.empty{color:var(--muted); padding-block:20px}

.checks{list-style:none; margin:0; padding:0}
.checks label{display:grid; grid-template-columns:22px 1fr; gap:10px; align-items:start; padding-block:7px; cursor:pointer}
.checks input{width:18px; height:18px; margin:3px 0 0; accent-color:var(--accent)}
.checks input:checked + span{color:var(--muted); text-decoration:line-through}

.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--surface)}
table{border-collapse:collapse; width:100%; font-size:14px}
th,td{text-align:left; padding:8px 12px; border-top:1px solid var(--line); font-variant-numeric:tabular-nums; white-space:nowrap}
th{font-size:12px; color:var(--muted); border-top:0; font-weight:700}
td.r, th.r{text-align:right}
td.m{white-space:normal; color:var(--muted)}

footer{margin-top:32px; font-size:12px; color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ nav button{transition:background .15s} }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <p class="eyebrow">2026.11.14 – 11.17 · 4인 · 샤먼(厦门)</p>
    <h1>샤먼 가족여행</h1>
    <p class="sub">부모님과 함께, 걷기는 적게 볼거리는 알차게</p>
    <div class="flights">
      <div class="flight"><b>KE125</b><div>11/14 (토) 인천 → 샤먼</div><div class="t">10:05 → 12:30</div></div>
      <div class="flight"><b>KE126</b><div>11/17 (화) 샤먼 → 인천</div><div class="t">13:40 → 17:50</div></div>
    </div>
    <p class="tz">시간은 모두 <b>현지(중국) 시간</b>. 한국보다 1시간 느려요.</p>
  </header>

  <nav id="tabs" role="tablist" aria-label="여행 메뉴"></nav>
  <div id="views"></div>

  <footer>숙소 Haixi Yue homestay · 황춰로 568호 · 입장료, 시간, 영업 여부는 조사 시점 기준이라 현장에서 확인하세요.</footer>
</div>


<div id="photo" hidden role="dialog" aria-modal="true" aria-label="음식 사진"></div>

<script>
/* ---------- 데이터 ---------- */
const DAYS = [
  { id:'day1', n:'1일', date:'11/14 토', title:'도착, 중산루 저녁', lead:'첫날은 식사가 중요해요. 이동은 중산루 한 곳으로 줄였어요.',
    rows:[
      ['12:30','샤먼 가오치 공항 도착','KE125'],
      ['12:30','입국심사, 수하물','왕복 항공권과 숙소 예약 확인서 준비. 약 1시간 반 여유'],
      ['14:00','택시/디디로 숙소 이동','대략 25~40분. 중국어 주소는 지도 탭에서 복사'],
      ['15:00','숙소 체크인, 휴식','일찍 도착하면 짐부터 맡기기. 체크인 시간은 호스트에 확인'],
      ['16:30','중산루로 출발','택시 대략 30~40분. 피곤해 보이면 중산루를 3일차 저녁으로 미루기'],
      ['17:15','중산루 보행자거리 (中山路)','치러우(아케이드) 건축을 보며 가볍게 산책. 평지'],
      ['18:00','저녁','맛집 탭에서 고르기. 토요일 저녁 6~8시는 대기 30분쯤이라, 길면 식사 후에 산책'],
      ['19:30','땅콩탕, 위완 같은 간식','중산루 안'],
      ['20:00','택시로 숙소 복귀','대략 30~40분'],
    ],
    after:{h:'도착 전에', items:['알리페이 또는 위챗페이, 지도앱(Amap), 디디 설치','숙소 근처 편의점, 마트 위치 확인']}
  },
  { id:'day2', n:'2일', date:'11/15 일', title:'남정 토루', lead:'하루 종일 토루. 차량을 대절해서 편하게 다녀와요.',
    rows:[
      ['07:30','아침','숙소 주변'],

function lsGet(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

/* ---------- 일자 뷰 ---------- */
function dayView(d){
  const rows = d.rows.map(r => {
    const tag = r[3]==='opt' ? '<span class="tag opt">선택</span>' : r[3]==='book' ? '<span class="tag book">예약</span>' : '';
    return `<li><div class="time">${esc(r[0])}</div><div class="ev"><strong>${esc(r[1])}${tag}</strong>${r[2]?`<span class="note">${esc(r[2])}</span>`:''}</div></li>`;
  }).join('');
  const box = d.box ? `<div class="box gap ${d.box.cls}"><h4>${esc(d.box.h)}</h4><ul>${d.box.lines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>` : '';
  const after = d.after ? `<div class="box gap"><h4>${esc(d.after.h)}</h4><ul>${d.after.items.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>` : '';
  return `<h2>${esc(d.date)} · ${esc(d.title)}</h2><p class="lead">${esc(d.lead)}</p><ol class="timeline">${rows}</ol>${box}${after}`;
}

/* ---------- 지도 뷰 ---------- */
/* WGS84(GPS) -> GCJ-02. 중국 지도(Amap) 타일은 GCJ-02 좌표라 GPS 좌표를 그대로 찍으면 수백 m 어긋나요. */
function wgs2gcj(lat, lng){
  const a = 6378245.0, ee = 0.00669342162296594323, PI = Math.PI;
  const x = lng - 105, y = lat - 35;
  let dLat = -100 + 2*x + 3*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  dLat += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  dLat += (20*Math.sin(y*PI) + 40*Math.sin(y/3*PI)) * 2/3;
  dLat += (160*Math.sin(y/12*PI) + 320*Math.sin(y*PI/30)) * 2/3;
  let dLng = 300 + x + 2*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  dLng += (20*Math.sin(6*x*PI) + 20*Math.sin(2*x*PI)) * 2/3;
  dLng += (20*Math.sin(x*PI) + 40*Math.sin(x/3*PI)) * 2/3;
  dLng += (150*Math.sin(x/12*PI) + 300*Math.sin(x/30*PI)) * 2/3;
  const rad = lat/180*PI; let m = Math.sin(rad); m = 1 - ee*m*m; const s = Math.sqrt(m);
  dLat = (dLat*180) / ((a*(1-ee)) / (m*s) * PI);
  dLng = (dLng*180) / (a/s * Math.cos(rad) * PI);
  return [lat + dLat, lng + dLng];
}
function km(a, b){
  const R = 6371, r = Math.PI/180, dLa = (b.lat-a.lat)*r, dLo = (b.lng-a.lng)*r;
  const h = Math.sin(dLa/2)**2 + Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
const fmtKm = d => d < 1 ? `${Math.max(50, Math.round(d*1000/50)*50)}m` : `${d < 10 ? d.toFixed(1) : Math.round(d)}km`;

const ITEMS = [
  ...PLACES.filter(p => !p.nopin).map(p => ({ id:'p-'+p.id, kind:p.id==='home'?'home':'place', ko:p.ko, zh:p.zh, days:p.days, lat:p.lat, lng:p.lng, approx:p.approx })),
  ...REST.map(r => ({ id:'r-'+r.id, kind:'rest', ko:r.ko, zh:r.zh, days:RGEO[r.id].days, lat:RGEO[r.id].lat, lng:RGEO[r.id].lng, approx:RGEO[r.id].approx, r, g:RGEO[r.id] })),
  ...BARS.map(b => ({ id:'b-'+b.id, kind:'bar', ko:b.ko, zh:b.zh, days:b.days, lat:b.lat, lng:b.lng, b })),
];
const BASES = [['p-home','숙소'],['p-zs','중산루'],['p-ltl','구랑위']];
const MS = { day:'all', kind:'all', mode:'map', base:'p-home', me:null, watch:null };

function visibleItems(){
  return ITEMS.filter(it => it.kind==='home' || ((MS.kind==='all' || MS.kind===it.kind) && (MS.day==='all' || it.days.includes(Number(MS.day)))));
}
function origin(){ return MS.me || ITEMS.find(i => i.id===MS.base); }
function distLabel(it){
  const o = origin(); if(!o || o.id===it.id) return '';
  return (MS.me ? '내 위치에서 ' : (BASES.find(b=>b[0]===MS.base)||[])[1] + '에서 ') + fmtKm(km(o, it));
}
function navLinks(it){
  const name = it.zh || it.ko.replace(/\(.*?\)/g,'').trim();
  /* 길찾기(navigation) 링크는 출발지가 중국 밖이면 "결과 없음"이 떠서, 장소를 지도에 띄우는 marker 링크를 써요. 거기서 路线(경로)를 누르면 돼요. */
  const amapNav = `https://uri.amap.com/marker?position=${it.lng},${it.lat}&name=${encodeURIComponent(name)}&coordinate=wgs84&callnative=1`;
  const gNav = it.approx ? gmap((it.zh || it.ko.replace(/\(.*?\)/g,'').trim()) + ' 厦门') : `https://www.google.com/maps/dir/?api=1&destination=${it.lat},${it.lng}`;
  let h = (it.approx && it.zh) ? `<a class="lnk" href="${amap(it.zh)}" target="_blank" rel="noopener">Amap</a>`
    : `<a class="lnk" href="${amapNav}" target="_blank" rel="noopener">Amap</a>`;
  h += `<a class="lnk" href="${gNav}" target="_blank" rel="noopener">구글</a>`;
  if(it.r && it.r.link) h += `<a class="lnk" href="${it.r.link}" target="_blank" rel="noopener">${esc(it.r.linkLabel||'상세')}</a>`;
  if(it.b && it.b.link) h += `<a class="lnk" href="${it.b.link}" target="_blank" rel="noopener">${it.b.link.includes('michelin') ? '미쉐린 가이드' : 'Ctrip'}</a>`;
  if(it.zh) h += `<button class="copy" type="button" data-copy="${esc(it.zh)}">주소/이름 복사</button>`;
  return h;
}
function itemBody(it){
  const kindLbl = it.kind==='rest' ? '<span class="kind k-rest">식당</span>' : it.kind==='bar' ? '<span class="kind k-bar">바</span>'
    : '<span class="kind k-place">' + (it.kind==='home'?'숙소':'장소') + '</span>';
  let meta = kindLbl;
  if(it.r){ meta += esc([it.r.price, it.g.where || it.r.area].filter(Boolean).join(' · ')); }
  else if(it.b){ meta += esc([it.b.price, it.b.near + ' 근처', it.b.hours].join(' · ')); }
  else meta += esc(it.days.map(d => d+'일차').join(', '));
  if(it.approx) meta += ` <span class="approxnote">위치 대략</span>`;
  const dishes = it.g && it.g.dishes.length ? `<p class="meta">대표 메뉴 (후기 기준) · 📷 표시는 누르면 사진</p><div class="chips">${it.g.dishes.map(dishLink).join('')}</div>` : '';
  const sig = it.r ? `<p class="meta" style="color:var(--ink)">${esc(it.r.sig)}</p>`
    : it.b ? `<p class="meta" style="color:var(--ink)">${esc(it.b.type)} · ${esc(it.b.drinks)}</p><p class="meta">${esc(it.b.vibe)} · 부모님과: ${esc(it.b.parents)}</p>` : '';
  return `<div class="top"><h4>${esc(it.ko)}</h4><span class="dist">${esc(distLabel(it))}</span></div>
    ${it.zh ? `<div class="zh">${esc(it.zh)}</div>` : ''}
    <p class="meta">${meta}</p>${sig}${dishes}
    <div class="acts">${navLinks(it)}</div>`;
}

/* Leaflet 지도 */
let LM = null, layerAmap = null, layerOsm = null, curBase = 'amap', markerLayer = null, meLayer = null, tileOk = 0, tileErr = 0;
const MK = {};
const ICON = {
  /* 폰 기본 그림 문자를 써서 기기마다 가운데에 깔끔하게 그려지게 */
  rest:'<span aria-hidden="true">🍜</span>',
  place:'<span aria-hidden="true">📍</span>',
  home:'<span aria-hidden="true">🏠</span>',
  bar:'<span aria-hidden="true">🍸</span>',
};
const proj = (lat, lng) => curBase==='amap' ? wgs2gcj(lat, lng) : [lat, lng];
function mstatus(t, warn){ const el = $('#mstatus'); if(!el) return; el.textContent = t; el.classList.toggle('warn', !!warn); }
function initMap(){
  if(LM) return true;
  if(!window.L){ mstatus('지도 프로그램을 불러오지 못했어요. 인터넷 연결을 확인하거나 리스트 보기를 쓰세요.', true); return false; }
  /* 확대/축소 버튼은 오른쪽 아래로 옮겨서 팝업과 겹치지 않게 */
  LM = L.map('lmap', { zoomControl:false }).setView(proj(24.465, 118.11), 12);
  L.control.zoom({ position:'bottomright' }).addTo(LM);
  layerAmap = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', { subdomains:'1234', maxZoom:18, attribution:'© 高德地图 Amap' });
  layerOsm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' });
  layerAmap.addTo(LM);
  L.control.layers({ '중국 지도 (Amap)':layerAmap, 'OpenStreetMap':layerOsm }, null, { position:'topright' }).addTo(LM);
  [layerAmap, layerOsm].forEach(l => {
    l.on('tileload', () => { tileOk++; });
    l.on('tileerror', () => { tileErr++; if(tileErr >= 6 && tileOk === 0) mstatus('지도 그림을 불러오지 못했어요. 오른쪽 위에서 다른 지도를 고르거나 리스트 보기를 쓰세요.', true); });
  });
  LM.on('baselayerchange', e => { curBase = e.layer===layerAmap ? 'amap' : 'osm'; tileOk = 0; tileErr = 0; drawMarkers(); drawMe(); });
  LM.on('popupopen', syncChips);
  /* 확대했을 때만 핀 이름 표시 (멀리서는 겹쳐서 숨김) */
  const labelZoom = () => LM.getContainer().classList.toggle('show-labels', LM.getZoom() >= 14);
  LM.on('zoomend', labelZoom);
  const legend = L.control({ position:'bottomleft' });
  legend.onAdd = () => {
    const d = L.DomUtil.create('div', 'mlegend');
    d.innerHTML = `<span><i style="border-color:#D2412C">${ICON.rest}</i>식당</span><span><i style="border-color:#0B7F8C">${ICON.place}</i>장소</span><span><i style="border-color:#B5651D">${ICON.bar}</i>바</span><span><i style="border-color:#6A4FD0">${ICON.home}</i>숙소</span>`;
    return d;
  };
  legend.addTo(LM);
  markerLayer = L.layerGroup().addTo(LM);
  meLayer = L.layerGroup().addTo(LM);
  drawMarkers(); fitVisible(); drawMe(); labelZoom();
  return true;
}
function drawMarkers(){
  if(!LM) return;
  markerLayer.clearLayers();
  visibleItems().forEach(it => {
    const s = it.kind==='home' ? 40 : 32;
    const icon = L.divIcon({ className:'', html:`<div class="pin p-${it.kind} ${it.approx?'approx':''}">${ICON[it.kind]}</div>`,
      iconSize:[s,s], iconAnchor:[s/2, s+8], popupAnchor:[0, -(s+4)], tooltipAnchor:[s/2, -(s/2+8)] });
    const m = L.marker(proj(it.lat, it.lng), { icon, title:it.ko, zIndexOffset: it.kind==='home' ? 500 : it.kind==='rest' ? 100 : 0 })
      .bindPopup(() => `<div class="pc">${itemBody(it)}</div>`, { maxWidth:290, autoPanPaddingTopLeft:[10,60], autoPanPaddingBottomRight:[60,40] })
      .bindTooltip(it.kind==='home' ? '숙소' : it.ko.replace(/\(.*?\)/g,'').trim(), { permanent:true, direction:'right', className:'plabel', interactive:false });
    MK[it.id] = m; markerLayer.addLayer(m);
  });
}
function fitVisible(){
  if(!LM) return;
  const far = it => it.lng < 117.6;
  let pts = visibleItems().filter(it => MS.day==='2' || !far(it));
  if(MS.day!=='2' && pts.length < 2) pts = visibleItems();
  if(!pts.length) return;
  LM.fitBounds(L.latLngBounds(pts.map(it => proj(it.lat, it.lng))), { padding:[28,28], maxZoom:15 });
}
function drawMe(){
  if(!LM) return;
  meLayer.clearLayers();
  if(!MS.me) return;
  const p = proj(MS.me.lat, MS.me.lng);
  L.circle(p, { radius:MS.me.acc, weight:1, color:'#1A73E8', fillColor:'#1A73E8', fillOpacity:.1, interactive:false }).addTo(meLayer);
  L.marker(p, { icon:L.divIcon({ className:'', html:'<div class="me"></div>', iconSize:[16,16], iconAnchor:[8,8] }), zIndexOffset:1000, title:'내 위치' }).addTo(meLayer);
}

/* 리스트 */
function renderNear(){
  const ul = $('#nlist'); if(!ul) return;
  const o = origin();
  const list = visibleItems().filter(it => it.kind!=='home').map(it => ({ it, d: o ? km(o, it) : 0 })).sort((a,b) => a.d - b.d);
  ul.innerHTML = list.length ? list.map(x => `<li>${itemBody(x.it)}</li>`).join('') : '<li class="empty">조건에 맞는 곳이 없어요.</li>';
  $('#basePick').hidden = !!MS.me || MS.mode!=='list';
}
function setMode(m){
  MS.mode = m;
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode===m)));
  $('#lmap').hidden = m!=='map';
  $('#nlist').hidden = m!=='list';
  if(m==='map'){ if(initMap()) setTimeout(() => LM.invalidateSize(), 0); }
  renderNear();
}
function toggleLoc(){
  const btn = $('#locBtn');
  if(MS.watch !== null){
    navigator.geolocation.clearWatch(MS.watch); MS.watch = null; MS.me = null;
    btn.dataset.on = '0'; btn.textContent = '◎ 내 위치'; drawMe(); renderNear();
    mstatus('내 위치 표시를 껐어요.'); return;
  }
  if(!navigator.geolocation){ mstatus('이 브라우저에서는 위치를 쓸 수 없어요.', true); return; }
  mstatus('위치를 찾는 중이에요…');
  let first = true;
  MS.watch = navigator.geolocation.watchPosition(p => {
    MS.me = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy };
    btn.dataset.on = '1'; btn.textContent = '◉ 내 위치 끄기';
    drawMe(); renderNear();
    if(first && LM && MS.mode==='map'){ LM.setView(proj(MS.me.lat, MS.me.lng), Math.max(LM.getZoom(), 15)); }
    first = false;
    mstatus(`내 위치를 표시하고 있어요 (오차 약 ${Math.round(MS.me.acc)}m). 리스트는 내 위치에서 가까운 순이에요.`);
  }, err => {
    if(MS.watch !== null) navigator.geolocation.clearWatch(MS.watch);
    MS.watch = null; MS.me = null; btn.dataset.on = '0'; btn.textContent = '◎ 내 위치'; drawMe(); renderNear();
    mstatus(err.code === 1 ? '위치 권한이 꺼져 있어요. 브라우저 설정에서 이 사이트의 위치 접근을 허용한 뒤 다시 눌러 주세요.'
      : '위치를 찾지 못했어요. 잠시 뒤 다시 눌러 주세요.', true);
  }, { enableHighAccuracy:true, maximumAge:15000, timeout:20000 });
}
function focusItem(id){
  MS.day = 'all'; MS.kind = 'all';
  document.querySelectorAll('.dayf').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.f==='all')));
  document.querySelectorAll('.kindf').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.k==='all')));
  renderPlaces('all');
  setMode('map');
  if(!LM || !MK[id]) return;
  const it = ITEMS.find(i => i.id===id);
  LM.setView(proj(it.lat, it.lng), 16);
  MK[id].openPopup();
}

function placeItem(p){

function dishLink(id){
  const d = DISH[id]; if(!d) return '';
  const cam = PHOTOS[id] ? ' <span class="cam" aria-hidden="true">📷</span>' : '';
  return `<button class="chip dish" type="button" data-photo="${id}"><span class="z">${esc(d.zh)}${cam}</span><span class="k">${esc(d.ko)}</span></button>`;
}
function dishChip(i){ return dishLink(i[0]); }
function openPhoto(id){
  const d = DISH[id], p = PHOTOS[id];
  const img = p ? `<div class="img"><img src="${esc(p.thumb)}" alt="${esc(d.ko)} 사진" loading="eager"></div>` : '';
  const none = p ? '' : `<p class="credit">이 음식은 쓸 수 있는 사진이 없어요. <a href="https://search.naver.com/search.naver?where=image&query=${encodeURIComponent(d.zh)}" target="_blank" rel="noopener">네이버에서 사진 검색</a></p>`;
  const credit = p ? `<p class="credit">사진: ${esc(p.author)} · ${esc(p.license)} · <a href="${esc(p.file)}" target="_blank" rel="noopener">위키미디어 공용</a>${p.match==='GENERIC' ? ' · 비슷한 음식 사진이에요' : ''}</p>` : '';
  $('#photo').innerHTML = `<button type="button" class="close" data-close-photo>닫기</button>
    <div class="card" role="document">${img}
    <div class="txt"><div class="z">${esc(d.zh)}</div><div class="k">${esc(d.ko)}</div>${credit}${none}</div></div>`;
  $('#photo').hidden = false;
}
function closePhoto(){ $('#photo').hidden = true; $('#photo').innerHTML = ''; }
function foodView(){
  const fchips = RFILTERS.map(f => `<button class="chip rf" type="button" data-f="${f[0]}" aria-pressed="${f[0]==='all'}">${esc(f[1])}</button>`).join('');
  const dict = DICT.map(g => `<h3>${esc(g.h)}</h3><div class="chips">${g.items.map(dishChip).join('')}</div>`).join('');
  return `<h2>맛집, 메뉴</h2><p class="lead">식당 후보와 샤먼에서 자주 먹는 음식이에요. 음식 이름을 누르면 사진을 볼 수 있어요.</p>
    <div class="chips" id="restChips">${fchips}</div>
    <div id="restList">${REST.map(restCard).join('')}</div>
    <div class="box gap"><h4>해산물 식당 주문 팁</h4><ul>
      <li>수조에서 고르는 곳은 가격표(보통 500g 기준)가 분명한 정찰제 식당으로</li>
      <li>무게 잴 때 저울 숫자를 사진으로 남기면 안심이에요</li>
      <li>튀김보다 찜 위주로 시키면 속이 편해요</li>
      <li>대부분 따뜻한 차가 기본이에요. 얼음물은 따로 요청</li>
    </ul></div>
    <h2 style="margin-top:28px">음식 사전</h2><p class="lead">샤먼에서 자주 보는 음식이에요. 누르면 사진 검색이 열려요. 식당마다 메뉴가 다르니 실제 주문은 메뉴판을 보고 하세요.</p>
    ${dict}
    <h3>식당에서 쓰는 한마디</h3>
    <ul class="plist">${MODS.map(m=>`<li><div><div class="ko">${esc(m[1])}</div><div class="zh">${esc(m[2])}</div></div><div class="acts"><button class="copy" type="button" data-copy="${esc(m[2])}">복사</button></div></li>`).join('')}</ul>`;
}

/* ---------- 준비 뷰 ---------- */
function prepView(){
  const store = lsGet('xiamen-checks-v2', {});
  const book = `<h3>먼저 예약할 것</h3><ul class="book-list">${BOOKINGS.map(b=>
    `<li><div><b>${esc(b[0])}</b><span class="d">${esc(b[1])}</span></div><span class="when">${esc(b[2])}</span></li>`).join('')}</ul>`;
  const lists = CHECKS.map(g => `<h3>${esc(g.h)}</h3><ul class="checks">${g.items.map(i =>
    `<li><label><input type="checkbox" id="c-${i[0]}" data-key="${i[0]}" ${store[i[0]]?'checked':''}><span>${esc(i[1])}</span></label></li>`).join('')}</ul>`).join('');
  const cost = `<h3>비용 (4인, 위안)</h3><div class="tablewrap"><table><thead><tr><th>항목</th><th class="r">1인</th><th class="r">4인</th><th>비고</th></tr></thead><tbody>${
    COSTS.map(c=>`<tr><td>${esc(c[0])}</td><td class="r">¥${c[1]}</td><td class="r">¥${c[1]*4}</td><td class="m">${esc(c[2])}</td></tr>`).join('')
  }<tr><td>토루 차량/투어</td><td class="r">-</td><td class="r">-</td><td class="m">문의 후 기입</td></tr><tr><td>난푸퉈사</td><td class="r">무료로 알려짐</td><td class="r">-</td><td class="m">확인 필요</td></tr></tbody></table></div>`;
  return `<h2>준비</h2><p class="lead">체크 표시는 이 기기에만 저장돼요.</p>${book}${lists}${cost}`;
}

/* ---------- 조립 ---------- */
const VIEWS = [
  ...DAYS.map(d => ({id:d.id, label:d.n, sub:d.date.slice(0,5), html:dayView(d)})),
  {id:'map', label:'지도', sub:'경로', html:mapView()},
  {id:'food', label:'맛집', sub:'메뉴', html:foodView()},
  {id:'prep', label:'준비', sub:'체크', html:prepView()},
];
const tabs = $('#tabs'), views = $('#views');
tabs.innerHTML = VIEWS.map(v => `<button type="button" role="tab" id="tab-${v.id}" data-id="${v.id}" aria-controls="v-${v.id}"><b>${esc(v.label)}</b><small>${esc(v.sub)}</small></button>`).join('');
views.innerHTML = VIEWS.map(v => `<section class="view" id="v-${v.id}" role="tabpanel" aria-labelledby="tab-${v.id}" hidden>${v.html}</section>`).join('');

let currentView = 'day1';
function show(id, scroll){
  if(id === 'places') id = 'map';
  if(!VIEWS.some(v => v.id===id)) id = 'day1';
  currentView = id;
  VIEWS.forEach(v => {
    $('#v-'+v.id).hidden = v.id !== id;
    $('#tab-'+v.id).setAttribute('aria-selected', String(v.id === id));
  });
  syncChips();
  if(id === 'map' && MS.mode === 'map'){ if(initMap()) setTimeout(() => LM.invalidateSize(), 0); }
  if(scroll){ const n = $('#tabs'); window.scrollTo({top: Math.max(0, n.offsetTop - (parseFloat(getComputedStyle(document.documentElement).paddingTop)||0)), behavior:'auto'}); }
}
tabs.addEventListener('click', e => {
  const b = e.target.closest('button[data-id]'); if(!b) return;
  location.hash = b.dataset.id; show(b.dataset.id, true);
});
window.addEventListener('hashchange', () => show(location.hash.slice(1), false));

renderPlaces('all');
show(location.hash.slice(1) || 'day1', false);

/* ---------- 이벤트 ---------- */
async function onClick(e){
  const t = e.target;
  let b;
  if((b = t.closest('.dayf'))){
    document.querySelectorAll('.dayf').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    renderPlaces(b.dataset.f); return;
  }
  if((b = t.closest('.kindf'))){
    document.querySelectorAll('.kindf').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    MS.kind = b.dataset.k; drawMarkers(); fitVisible(); renderNear(); return;
  }
  if((b = t.closest('.basef'))){
    document.querySelectorAll('.basef').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    MS.base = b.dataset.b; renderNear(); return;
  }
  if((b = t.closest('[data-mode]'))){ setMode(b.dataset.mode); return; }
  if(t.closest('#locBtn')){ toggleLoc(); return; }
  if((b = t.closest('[data-showmap]'))){ location.hash = 'map'; show('map', true); focusItem(b.dataset.showmap); return; }
  if((b = t.closest('.rf'))){
    document.querySelectorAll('.rf').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    document.querySelectorAll('#restList .rest').forEach(c => { c.hidden = !(b.dataset.f==='all' || c.dataset.tags.split(' ').includes(b.dataset.f)); });
    return;
  }
  if((b = t.closest('[data-photo]'))){ openPhoto(b.dataset.photo); return; }
  if(t.closest('[data-close-photo]') || t.id === 'photo'){ closePhoto(); return; }
  if((b = t.closest('.copy'))){ await doCopy(b.dataset.copy, b); return; }
}
document.addEventListener('click', onClick);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$('#photo').hidden) closePhoto(); });
views.addEventListener('change', e => {
  const k = e.target.dataset && e.target.dataset.key; if(!k) return;
  const o = lsGet('xiamen-checks-v2', {}); if(e.target.checked) o[k]=1; else delete o[k]; lsSet('xiamen-checks-v2', o);
});
async function doCopy(text, btn){
  let ok = false;
  try{ await navigator.clipboard.writeText(text); ok = true; }catch(err){
    const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    try{ ok = document.execCommand('copy'); }catch(e2){}
    ta.remove();
  }
  const old = btn.textContent; btn.textContent = ok ? '복사됨' : '길게 눌러 복사';
  setTimeout(() => { btn.textContent = old; }, 1400);
}
syncChips();
</script>
